name: Playwright BDD Tests

on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "both"
        type: choice
        options:
          - dev
          - staging
          - both
      suite_all:
        description: "All suites (uncheck to choose specific suites)"
        required: true
        default: true
        type: boolean
      suite_smoke:
        description: "Smoke suite"
        required: true
        default: false
        type: boolean
      suite_ui:
        description: "UI suite"
        required: true
        default: false
        type: boolean
      suite_api:
        description: "API suite"
        required: true
        default: false
        type: boolean
      suite_db:
        description: "DB suite"
        required: true
        default: false
        type: boolean
      app1:
        description: "Include app1 UI/DB tests"
        required: true
        default: true
        type: boolean
      app2:
        description: "Include app2 UI/DB tests"
        required: true
        default: true
        type: boolean
      app3:
        description: "Include app3 UI/DB tests"
        required: true
        default: true
        type: boolean
      browser:
        description: "Browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'schedule' && fromJSON('["dev"]') || (github.event.inputs.environment == 'both' && fromJSON('["dev","staging"]') || fromJSON(format('["{0}"]', github.event.inputs.environment))) }}

    env:
      TEST_ENV: ${{ matrix.environment }}
      BROWSER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.browser || 'chromium' }}
      SUITE_ALL: ${{ github.event.inputs.suite_all }}
      SUITE_SMOKE: ${{ github.event.inputs.suite_smoke }}
      SUITE_UI: ${{ github.event.inputs.suite_ui }}
      SUITE_API: ${{ github.event.inputs.suite_api }}
      SUITE_DB: ${{ github.event.inputs.suite_db }}
      APP1: ${{ github.event.inputs.app1 }}
      APP2: ${{ github.event.inputs.app2 }}
      APP3: ${{ github.event.inputs.app3 }}
      AWS_REGION: us-east-1
      SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
      SES_TO_EMAIL: ${{ secrets.SES_TO_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps "$BROWSER"

      - name: Generate BDD tests
        run: npm run bddgen

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$SUITE_ALL" = "true" ]; then
              suite_smoke=false
              suite_ui=true
              suite_api=true
              suite_db=true
            else
              suite_smoke="$SUITE_SMOKE"
              suite_ui="$SUITE_UI"
              suite_api="$SUITE_API"
              suite_db="$SUITE_DB"
            fi

            app_pattern=""
            if [ "$APP1" = "true" ]; then app_pattern="app1"; fi
            if [ "$APP2" = "true" ]; then app_pattern="${app_pattern:+$app_pattern|}app2"; fi
            if [ "$APP3" = "true" ]; then app_pattern="${app_pattern:+$app_pattern|}app3"; fi

            if [ -z "$app_pattern" ] && { [ "$suite_smoke" = "true" ] || [ "$suite_ui" = "true" ] || [ "$suite_db" = "true" ]; }; then
              echo "Select at least one app for the selected UI/DB suites."
              exit 1
            fi

            grep_patterns=()
            if [ "$suite_smoke" = "true" ]; then
              grep_patterns+=("(?=.*@api)(?=.*@smoke)")
              if [ -n "$app_pattern" ]; then
                grep_patterns+=("(?=.*@(ui|db))(?=.*@smoke)(?=.*@($app_pattern))")
              fi
            fi
            if [ "$suite_api" = "true" ]; then grep_patterns+=("(?=.*@api)"); fi
            if [ "$suite_ui" = "true" ] && [ -n "$app_pattern" ]; then
              grep_patterns+=("(?=.*@ui)(?=.*@($app_pattern))")
            fi
            if [ "$suite_db" = "true" ] && [ -n "$app_pattern" ]; then
              grep_patterns+=("(?=.*@db)(?=.*@($app_pattern))")
            fi

            if [ "${#grep_patterns[@]}" -eq 0 ]; then
              echo "Select at least one suite."
              exit 1
            fi

            grep_pattern="$(IFS='|'; printf '%s' "${grep_patterns[*]}")"
            npx playwright test --grep "$grep_pattern"
          else
            npm test
          fi

      - name: Generate metrics
        if: always()
        run: npm run metrics

      - name: Send SES report
        if: always()
        run: npm run report:email

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.environment }}
          path: |
            playwright-report/
            test-results/
            features-gen/
