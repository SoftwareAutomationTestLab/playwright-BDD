name: Playwright BDD Tests

on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "both"
        type: choice
        options:
          - dev
          - staging
          - both
      suite:
        description: "Suite"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - ui
          - api
          - db
      app:
        description: "App (used for UI and DB suites)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - app1
          - app2
          - app3
      browser:
        description: "Browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'schedule' && fromJSON('["dev"]') || (github.event.inputs.environment == 'both' && fromJSON('["dev","staging"]') || fromJSON(format('["{0}"]', github.event.inputs.environment))) }}

    env:
      TEST_ENV: ${{ matrix.environment }}
      BROWSER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.browser || 'chromium' }}
      AWS_REGION: us-east-1
      SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
      SES_TO_EMAIL: ${{ secrets.SES_TO_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps "$BROWSER"

      - name: Generate BDD tests
        run: npm run bddgen

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            suite="${{ github.event.inputs.suite }}"
            app="${{ github.event.inputs.app }}"
            case "$suite" in
              smoke) npm run test:smoke ;;
              api) npm run test:api ;;
              ui)
                if [ "$app" = "all" ]; then
                  npm run test:ui
                else
                  npx playwright test --grep "@ui.*@$app"
                fi
                ;;
              db)
                if [ "$app" = "all" ]; then
                  npm run test:db
                else
                  npx playwright test --grep "@db.*@$app"
                fi
                ;;
              *) npm test ;;
            esac
          else
            npm test
          fi

      - name: Generate metrics
        if: always()
        run: npm run metrics

      - name: Send SES report
        if: always()
        run: npm run report:email

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.environment }}
          path: |
            playwright-report/
            test-results/
            features-gen/
