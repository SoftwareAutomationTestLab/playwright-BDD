name: Playwright BDD Tests

on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "both"
        type: choice
        options:
          - dev
          - staging
          - both
      test_suite:
        description: "TestSuite"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - FullRegression
          - ModerateRegression
      test_app:
        description: "TestApps"
        required: true
        default: "All"
        type: choice
        options:
          - All
          - APP1 UI
          - APP2 UI
          - APP3 UI
          - API-Group1
          - API-Group2
          - APP1db
          - App2db
          - App3db
      browser:
        description: "Browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'schedule' && fromJSON('["dev"]') || (github.event.inputs.environment == 'both' && fromJSON('["dev","staging"]') || fromJSON(format('["{0}"]', github.event.inputs.environment))) }}

    env:
      TEST_ENV: ${{ matrix.environment }}
      BROWSER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.browser || 'chromium' }}
      TEST_SUITE: ${{ github.event.inputs.test_suite }}
      TEST_APP: ${{ github.event.inputs.test_app }}
      AWS_REGION: us-east-1
      SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
      SES_TO_EMAIL: ${{ secrets.SES_TO_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps "$BROWSER"

      - name: Generate BDD tests
        run: npm run bddgen

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            suite="$TEST_SUITE"
            test_app="$TEST_APP"
          else
            suite="scheduled"
            test_app="All"
          fi

          case "$suite" in
            smoke) suite_pattern="(?=.*@smoke)" ;;
            FullRegression) suite_pattern="" ;;
            ModerateRegression) suite_pattern="(?=.*@regression)" ;;
            scheduled) suite_pattern="((?=.*@smoke)|(?=.*@regression))" ;;
            *) echo "Unsupported test suite: $suite"; exit 1 ;;
          esac

          case "$test_app" in
            All) app_pattern="" ;;
            "APP1 UI") app_pattern="(?=.*@ui)(?=.*@app1)" ;;
            "APP2 UI") app_pattern="(?=.*@ui)(?=.*@app2)" ;;
            "APP3 UI") app_pattern="(?=.*@ui)(?=.*@app3)" ;;
            API-Group1) app_pattern="(?=.*@api)(?=.*@API-Group1)" ;;
            API-Group2) app_pattern="(?=.*@api)(?=.*@API-Group2)" ;;
            APP1db) app_pattern="(?=.*@db)(?=.*@app1)" ;;
            App2db) app_pattern="(?=.*@db)(?=.*@app2)" ;;
            App3db) app_pattern="(?=.*@db)(?=.*@app3)" ;;
            *) echo "Unsupported test app: $test_app"; exit 1 ;;
          esac

          grep_pattern="${suite_pattern}${app_pattern}"
          if [ -n "$grep_pattern" ]; then
            npx playwright test --grep "$grep_pattern"
          else
            npx playwright test
          fi

      - name: Generate metrics
        if: always()
        run: npm run metrics

      - name: Send SES report
        if: always()
        run: npm run report:email

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.environment }}
          path: |
            playwright-report/
            test-results/
            features-gen/
